      <text x="12" y="130" font-size="11" fill="#94a3b8">Semantic chunking indexed</text>
      <text x="12" y="145" font-size="11" fill="#94a3b8">into pgvector for concept search</text>

      <rect y="180" width="218" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
