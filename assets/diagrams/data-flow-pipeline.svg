  <!-- Bottom Data Lifecycle Flow -->
  <g transform="translate(60, 560)">
    <rect width="1080" height="95" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="30" fill="#f59e0b" font-size="12" font-weight="700" letter-spacing="1">PROJECT SHOWCASE &amp; CLAUDE INTEGRATION REQUEST</text>
    <text x="30" y="55" fill="#f8fafc" font-size="14" font-weight="600">FileVault is Live at filevault.cc · Requesting Claude's Help &amp; Subscription to Integrate Claude AI</text>
    <text x="30" y="75" fill="#94a3b8" font-size="12">Currently serving 7,500+ engineering students at NITK Surathkal with zero-friction access. Claude AI will unlock handwritten note OCR and grounded RAG revision.</text>
    
    <rect x="940" y="30" width="110" height="34" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="995" y="52" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="700">CLAUDE PLAN</text>
  </g>

  <!-- Footer -->
  <g transform="translate(60, 680)">
    <text x="0" y="20" fill="#64748b" font-size="12">FileVault Academic Pipeline · NITK Surathkal · Requesting Claude Team Support for AI Integration</text>
  </g>
</svg>