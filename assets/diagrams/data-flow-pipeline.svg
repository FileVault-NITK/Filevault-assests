      <text x="12" y="40" font-size="11" fill="#94a3b8">Fuzzy match across 1,000s</text>
      <text x="12" y="55" font-size="11" fill="#94a3b8">of course files in &lt;10ms</text>

      <rect y="80" width="188" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="102" fill="#fbbf24" font-weight="700">Rich In-Browser Preview</text>
      <text x="12" y="120" font-size="11" fill="#94a3b8">Live PDF, images, video streaming</text>
      <text x="12" y="135" font-size="11" fill="#94a3b8">and audio without downloads</text>

      <rect y="170" width="188" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="192" fill="#fbbf24" font-weight="700">Multi-Select &amp; ZIP (Live)</text>
      <text x="12" y="210" font-size="11" fill="#94a3b8">Client-side JSZip assembly</text>
      <text x="12" y="225" font-size="11" fill="#94a3b8">Zero server compute load</text>

      <rect y="260" width="188" height="75" rx="8" fill="#78350f" stroke="#fbbf24" stroke-width="1"/>
      <text x="12" y="282" fill="#ffffff" font-weight="700">Claude RAG (Proposed)</text>
      <text x="12" y="300" font-size="11" fill="#fef3c7">Side-by-side note comparison</text>
      <text x="12" y="315" font-size="11" fill="#fef3c7">and Claude AI exam revision</text>
    </g>
