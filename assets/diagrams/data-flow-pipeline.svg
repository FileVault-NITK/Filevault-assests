    <text x="32" y="38" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">1</text>
    <text x="56" y="30" fill="#38bdf8" font-size="11" font-weight="700">STAGE 1 (LIVE)</text>
    <text x="56" y="46" fill="#ffffff" font-size="15" font-weight="700">Submission &amp; Gate</text>

    <g transform="translate(16, 70)" font-size="12" fill="#cbd5e1">
      <rect width="208" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#38bdf8" font-weight="700">Student Submission</text>
      <text x="12" y="40" font-size="11" fill="#94a3b8">Lecture slides, lab guides,</text>
      <text x="12" y="55" font-size="11" fill="#94a3b8">syllabus &amp; past exam papers</text>

      <rect y="80" width="208" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="102" fill="#38bdf8" font-weight="700">Bot Shield &amp; Honeypot</text>
      <text x="12" y="120" font-size="11" fill="#94a3b8">Google reCAPTCHA v3 verify</text>
      <text x="12" y="135" font-size="11" fill="#94a3b8">Webhook payload validation</text>

      <rect y="170" width="208" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="192" fill="#38bdf8" font-weight="700">Integrity &amp; Virus Check</text>
      <text x="12" y="210" font-size="11" fill="#94a3b8">MIME-type deep inspection</text>
      <text x="12" y="225" font-size="11" fill="#94a3b8">SHA-256 hash generation</text>
      <text x="12" y="240" font-size="11" fill="#94a3b8">Duplicate content detection</text>

      <rect y="270" width="208" height="65" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
