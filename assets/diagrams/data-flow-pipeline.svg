      <text x="12" y="145" font-size="11" fill="#94a3b8">Git LFS revision tracking</text>

      <rect y="180" width="218" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="202" fill="#34d399" font-weight="700">Edge CDN Invalidation</text>
      <text x="12" y="220" font-size="11" fill="#94a3b8">Targeted cache tag purge</text>
      <text x="12" y="235" font-size="11" fill="#94a3b8">Propagated globally in &lt;150ms</text>

      <rect y="270" width="218" height="65" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
      <text x="12" y="292" fill="#ffffff" font-weight="700">Lifecycle Archival Rule</text>
      <text x="12" y="310" font-size="11" fill="#d1fae5">Automatic transition to</text>
      <text x="12" y="325" font-size="11" fill="#d1fae5">cold storage after 180 days</text>
    </g>
  </g>

  <!-- Arrow 3 to 4 -->
  <g transform="translate(885, 310)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#34d399" stroke-width="2"/>
    <polygon points="30,-4 38,0 30,4" fill="#34d399"/>
