      <text x="16" y="26" fill="#fbbf24" font-size="13" font-weight="700">Claude Vision OCR (To Integrate)</text>
      <text x="16" y="48" fill="#cbd5e1" font-size="11">· Parse 40%+ handwritten student notes</text>
      <text x="16" y="66" fill="#cbd5e1" font-size="11">· Extract calculus &amp; circuit formulas into LaTeX</text>
      <text x="16" y="84" fill="#cbd5e1" font-size="11">· Diagram captioning for engineering schematics</text>
      <text x="16" y="102" fill="#94a3b8" font-size="10">Target: Claude 3.5 Sonnet Vision</text>
    </g>

    <g transform="translate(20, 210)">
      <rect width="290" height="110" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="26" fill="#fbbf24" font-size="13" font-weight="700">Dense Vector Search (To Integrate)</text>
      <text x="16" y="48" fill="#cbd5e1" font-size="11">· High-dimensional dense embeddings</text>
      <text x="16" y="66" fill="#cbd5e1" font-size="11">· Hybrid lexical (BM25) + semantic search</text>
      <text x="16" y="84" fill="#cbd5e1" font-size="11">· Search across 50,000+ lecture slides</text>
      <text x="16" y="102" fill="#94a3b8" font-size="10">HNSW Index in pgvector</text>
    </g>

    <g transform="translate(20, 340)">
      <rect width="290" height="95" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="26" fill="#fbbf24" font-size="13" font-weight="700">Claude RAG Assistant (To Integrate)</text>
      <text x="16" y="48" fill="#cbd5e1" font-size="11">· Grounded Q&amp;A on NITK course syllabus</text>
      <text x="16" y="66" fill="#cbd5e1" font-size="11">· Auto-generate practice quizzes &amp; summaries</text>
      <text x="16" y="84" fill="#cbd5e1" font-size="11">· Strict zero-hallucination citation bounds</text>
    </g>

    <g transform="translate(20, 455)">
      <rect width="290" height="75" rx="10" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="16" y="24" fill="#fde68a" font-size="12" font-weight="700">The Ask: Claude Team Support</text>
      <text x="16" y="44" fill="#fef3c7" font-size="11">Requesting Claude Max subscription &amp; guidance</text>
      <text x="16" y="60" fill="#fef3c7" font-size="11">to integrate this intelligence layer into FileVault.</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(60, 695)">
    <rect width="1080" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="30" fill="#94a3b8" font-size="13">
      <tspan fill="#f59e0b" font-weight="700">FileVault System Sizing</tspan> · Real Production Foundation + Proposed Claude Integration Blueprint
    </text>
    <text x="1050" y="30" text-anchor="end" fill="#64748b" font-size="12">Claude Integration Blueprint</text>
  </g>
