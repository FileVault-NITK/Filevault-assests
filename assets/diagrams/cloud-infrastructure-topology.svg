      <text x="16" y="26" fill="#38bdf8" font-size="13" font-weight="700">Edge Security Gateway (Live)</text>
      <text x="16" y="48" fill="#cbd5e1" font-size="11">· Web Application Firewall (WAF)</text>
      <text x="16" y="66" fill="#cbd5e1" font-size="11">· Intelligent L3/L4/L7 DDoS mitigation</text>
      <text x="16" y="84" fill="#cbd5e1" font-size="11">· Google reCAPTCHA v3 bot verification</text>
