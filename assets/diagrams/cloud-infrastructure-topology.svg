      <text x="16" y="66" fill="#cbd5e1" font-size="11">· Git LFS high-capacity academic datasets</text>
      <text x="16" y="84" fill="#cbd5e1" font-size="11">· Hot, warm, and 10-year question archives</text>
      <text x="16" y="102" fill="#94a3b8" font-size="10">Multi-gigabyte verified academic data</text>
    </g>

