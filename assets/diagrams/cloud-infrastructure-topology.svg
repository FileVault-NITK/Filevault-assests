  <rect width="1200" height="780" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.2">
    <path d="M0,130 L1200,130 M0,270 L1200,270 M0,410 L1200,410 M0,550 L1200,550 M0,690 L1200,690"/>
    <path d="M200,0 L200,780 M400,0 L400,780 M600,0 L600,780 M800,0 L800,780 M1000,0 L1000,780"/>
  </g>

  <!-- Title Header -->
  <g transform="translate(60, 48)">
