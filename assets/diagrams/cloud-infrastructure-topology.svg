      <text x="16" y="48" fill="#cbd5e1" font-size="11">· Profiles, taxonomies, and verified contributions</text>
      <text x="16" y="66" fill="#cbd5e1" font-size="11">· Row-Level Security (RLS) policies</text>
      <text x="16" y="84" fill="#cbd5e1" font-size="11">· Point-in-time recovery (PITR) enabled</text>
    </g>

    <g transform="translate(20, 455)">
      <rect width="320" height="75" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="16" y="24" fill="#a7f3d0" font-size="12" font-weight="700">Production Stability</text>
      <text x="16" y="44" fill="#d1fae5" font-size="11">Platform has maintained 99.8% availability over</text>
      <text x="16" y="60" fill="#d1fae5" font-size="11">12 months serving thousands of NITK engineers.</text>
