      <text x="16" y="48" fill="#cbd5e1" font-size="11">· In-memory edge cache for files.json manifest</text>
      <text x="16" y="66" fill="#cbd5e1" font-size="11">· Stale-while-revalidate caching policy</text>
      <text x="16" y="84" fill="#cbd5e1" font-size="11">· 98.4% Cache Hit Ratio for static assets</text>
    </g>

    <g transform="translate(20, 425)">
      <rect width="290" height="105" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
      <text x="16" y="26" fill="#818cf8" font-size="13" font-weight="700">Real-World Concurrency</text>
      <text x="16" y="48" fill="#c7d2fe" font-size="11">· Baseline: 2,000 daily active students</text>
      <text x="16" y="66" fill="#c7d2fe" font-size="11">· Exam Peak: 4,000+ concurrent students</text>
