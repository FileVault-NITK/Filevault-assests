    <text x="19" y="25" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="900">✦</text>
    <text x="52" y="24" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="-0.5">FILEVAULT</text>
    <text x="175" y="24" fill="#f59e0b" font-size="22" font-weight="800">·</text>
    <text x="190" y="24" fill="#94a3b8" font-size="16" font-weight="600">Production Infrastructure &amp; Proposed Claude Integration Sizing</text>
    <rect x="870" y="4" width="210" height="28" rx="14" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="975" y="22" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="700" letter-spacing="0.5">INTEGRATION PROPOSAL</text>
  </g>

  <!-- Left: Ingestion & Edge Tier (LIVE) -->
  <g transform="translate(60, 110)" filter="url(#shadowBox)">
    <rect width="330" height="560" rx="14" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="20" y="20" width="4" height="28" rx="2" fill="url(#accentBlue)"/>
    <text x="34" y="32" fill="#93c5fd" font-size="11" font-weight="700" letter-spacing="0.5">LIVE INGRESS &amp; EDGE</text>
    <text x="34" y="52" fill="#ffffff" font-size="16" font-weight="700">Production Edge Distribution</text>

    <!-- Edge Components -->
    <g transform="translate(20, 80)">
      <rect width="290" height="95" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="26" fill="#38bdf8" font-size="13" font-weight="700">Global Anycast CDN (Live)</text>
      <text x="16" y="48" fill="#cbd5e1" font-size="11">· 300+ Edge Points of Presence (PoPs)</text>
      <text x="16" y="66" fill="#cbd5e1" font-size="11">· Automatic Brotli/Gzip file compression</text>
      <text x="16" y="84" fill="#cbd5e1" font-size="11">· Sub-20ms latency across Indian subcontinent</text>
    </g>

    <g transform="translate(20, 195)">
