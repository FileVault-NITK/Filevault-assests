    <text x="36" y="62" fill="#ffffff" font-size="16" font-weight="700">PostgreSQL Row-Level Security (RLS) &amp; Immutable Audit Logs</text>

    <g transform="translate(36, 75)" font-size="12">
      <rect x="0" y="5" width="240" height="26" rx="6" fill="#172554" stroke="#2563eb" stroke-width="1"/>
      <text x="120" y="22" text-anchor="middle" fill="#bfdbfe" font-weight="600">Row-Level Security Policies (RLS)</text>

      <rect x="255" y="5" width="250" height="26" rx="6" fill="#172554" stroke="#2563eb" stroke-width="1"/>
      <text x="380" y="22" text-anchor="middle" fill="#bfdbfe" font-weight="600">Role-Based Access Control</text>

      <rect x="520" y="5" width="240" height="26" rx="6" fill="#172554" stroke="#2563eb" stroke-width="1"/>
      <text x="640" y="22" text-anchor="middle" fill="#bfdbfe" font-weight="600">Automated Audit Trail of Submissions</text>

      <rect x="775" y="5" width="255" height="26" rx="6" fill="#172554" stroke="#2563eb" stroke-width="1"/>
      <text x="902" y="22" text-anchor="middle" fill="#bfdbfe" font-weight="600">Zero PII Tracking / No Cookies</text>
    </g>
  </g>

  <!-- Layer 4: Storage Encryption at Rest (LIVE) -->
  <g transform="translate(60, 515)" filter="url(#shadowBox)">
    <rect width="1080" height="115" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2"/>
    <rect x="20" y="16" width="6" height="83" rx="3" fill="#10b981"/>
    <text x="36" y="38" fill="#34d399" font-size="13" font-weight="700" letter-spacing="1">LAYER 4 · LIVE STORAGE AT-REST INTEGRITY (PROD)</text>
    <text x="36" y="62" fill="#ffffff" font-size="16" font-weight="700">AES-256 Encryption, SHA-256 Checksums &amp; Immutable Backup Replication</text>

    <g transform="translate(36, 75)" font-size="12">
      <rect x="0" y="5" width="245" height="26" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="122" y="22" text-anchor="middle" fill="#a7f3d0" font-weight="600">AES-GCM-256 At-Rest Encryption</text>

      <rect x="260" y="5" width="245" height="26" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="382" y="22" text-anchor="middle" fill="#a7f3d0" font-weight="600">Cryptographic SHA-256 File Hashes</text>

      <rect x="520" y="5" width="245" height="26" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="642" y="22" text-anchor="middle" fill="#a7f3d0" font-weight="600">Envelope Key Management</text>

      <rect x="780" y="5" width="250" height="26" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="905" y="22" text-anchor="middle" fill="#a7f3d0" font-weight="600">Cross-Cloud Backup Snapshots</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(60, 680)">
    <text x="0" y="20" fill="#64748b" font-size="12">FileVault Defense-in-Depth &amp; Planned Claude AI Privacy · NITK Surathkal</text>
  </g>
</svg>